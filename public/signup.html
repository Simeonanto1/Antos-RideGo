<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Antos RideGo</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">Antos RideGo</a>

            <a href="signin.html" class="text-link">
                Already have an account? Sign In
            </a>
        </nav>
    </header>

    <main class="account-page">

        <section class="account-card">
            <p class="tagline">WELCOME TO ANTOS RIDEGO</p>

            <h1>Create your account</h1>

            <p class="page-intro">
                Sign up to book rides quickly and view your bookings.
            </p>

            <form id="signupForm">

                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Enter the same password again"
                    minlength="6"
                    required
                >

                <button type="submit" class="button primary-button">
                    Create Account
                </button>

            </form>

            <p id="formMessage" class="form-message"></p>

            <p class="account-switch">
                Already have an account?
                <a href="signin.html">Sign in here</a>
            </p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
