<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In | Antos RideGo</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">Antos RideGo</a>

            <a href="signup.html" class="text-link">
                New here? Create an account
            </a>
        </nav>
    </header>

    <main class="account-page">

        <section class="account-card">
            <p class="tagline">WELCOME BACK</p>

            <h1>Sign in to your account</h1>

            <p class="page-intro">
                Sign in to book your next ride.
            </p>

            <form id="signinForm">

                <label for="signinEmail">Email Address</label>
                <input
                    type="email"
                    id="signinEmail"
                    placeholder="example@email.com"
                    required
                >

                <label for="signinPassword">Password</label>
                <input
                    type="password"
                    id="signinPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="button primary-button">
                    Sign In
                </button>

            </form>

            <p id="formMessage" class="form-message"></p>

            <p class="account-switch">
                Do not have an account?
                <a href="signup.html">Create one here</a>
            </p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
